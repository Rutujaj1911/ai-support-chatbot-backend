# Application
spring.application.name=ai-support-chatbot
server.port=8080

# PostgreSQL Database (Neon)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aichatbot}
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OpenAI / Gemini API
#ai.provider=${AI_PROVIDER:gemini}
#openai.api.key=${OPENAI_API_KEY:your-openai-key}
#openai.model=gpt-3.5-turbo
#openai.api.url=https://api.openai.com/v1/chat/completions

#gemini.api.key=AIzaSyCADTAr7BSaqbI3ggMD1IVMKXM8UpRpa6U
#gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

ai.provider=groq
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-8b-instant

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=${FILE_UPLOAD_DIR:uploads}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.aichatbot=DEBUG
logging.level.org.springframework.security=INFO

# CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
