# Application
spring.application.name=ai-support-chatbot
server.port=8080

# PostgreSQL Database (Neon)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OpenAI / Gemini API
#ai.provider=${AI_PROVIDER:gemini}
#openai.api.key=${OPENAI_API_KEY:your-openai-key}
#openai.model=gpt-3.5-turbo
#openai.api.url=https://api.openai.com/v1/chat/completions

ai.provider=groq
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-8b-instant

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=${FILE_UPLOAD_DIR:uploads}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.aichatbot=DEBUG
logging.level.org.springframework.security=INFO

# CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
